<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Munster Association of Romanian Speakers</title>
  <meta
    name="description"
    content="Munster Association of Romanian Speakers — connecting and supporting the Romanian-speaking community across Munster, Ireland."
  />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <nav class="navbar" aria-label="Primary">
      <!-- Logo + organisation name (top left) -->
      <a class="brand" href="#home" aria-label="Munster Association of Romanian Speakers — home">
        <img
          class="brand__logo"
          src="images/logo.png"
          alt="Munster Association of Romanian Speakers logo"
          width="56"
          height="56"
        />
        <span class="brand__text">
          <span class="brand__name">Munster Association</span>
          <span class="brand__sub">of Romanian Speakers</span>
        </span>
      </a>

      <!-- Mobile menu toggle -->
      <button
        class="nav-toggle"
        aria-label="Open menu"
        aria-controls="primary-menu"
        aria-expanded="false"
      >
        <span class="nav-toggle__bar"></span>
        <span class="nav-toggle__bar"></span>
        <span class="nav-toggle__bar"></span>
      </button>

      <!-- Navigation buttons -->
      <ul class="nav-menu" id="primary-menu">
        <li><a class="nav-link" href="#home">Home</a></li>
        <li><a class="nav-link" href="#about">About Us</a></li>
        <li><a class="nav-link" href="#past-events">Past Events</a></li>
        <li><a class="nav-link" href="#future-events">Future Events</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section id="home" class="section">
      <h1>Welcome</h1>
      <p>Munster Association of Romanian Speakers.</p>
    </section>
    <section id="about" class="section">
      <h2>About Us</h2>
      <p>Content coming soon.</p>
    </section>
    <section id="past-events" class="section">
      <h2>Past Events</h2>
      <p>Content coming soon.</p>
    </section>
    <section id="future-events" class="section">
      <h2>Future Events</h2>
      <p>Content coming soon.</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
